name: certiverxia

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  traefik:
    image: traefik:v3.7.14
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=info@certiverxia.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    logging: *logging

  backend:
    build: ../../Backend
    env_file: ./secrets/backend.env
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      PORT: 5000
      API_URL: https://certiverxia.com
      FRONTEND_URL: https://certiverxia.com
      CORS_ALLOWED_ORIGINS: https://certiverxia.com
      TRUST_PROXY: '1'
    command: ['sh', '-c', 'node scripts/productionPreflight.js && exec node server.js']
    volumes:
      - uploads:/usr/src/app/uploads
      - backups:/usr/src/app/backups
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://127.0.0.1:5000/health",r=>process.exit(r.statusCode===200?0:1)).on("error",()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ../../Frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_SAAS_ENABLED: 'true'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    logging: *logging

volumes:
  uploads:
  backups:
  letsencrypt:
