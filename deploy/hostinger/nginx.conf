server {
  listen 80;
  server_name certiverxia.com;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:;" always;
  add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
  location / { try_files $uri $uri/ /index.html; }
  location ^~ /share/ { access_log off; try_files $uri $uri/ /index.html; }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }
  location ~ /\. { deny all; }
}
