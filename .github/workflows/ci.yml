name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm ci
      - name: Run backend lint
        run: npm run lint
      - name: Audit backend dependencies
        run: npm audit --audit-level=high
      - name: Run backend tests
        run: npm test
      - name: Test tenant isolation and transactional issuance
        run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend lint
        run: npm run lint
      - name: Run frontend tests
        run: npm test -- --run
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Build frontend production bundle
        run: npm run build

  container-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone Atlas deployment configuration
        env:
          DEPLOYMENT_NAME: certverify-staging-ci
          DEPLOYMENT_ENV: staging
          BACKEND_ENV_FILE: ./Backend/.env.example
        run: docker compose -f docker-compose.atlas.yml config --quiet
      - name: Build backend production image
        run: docker build --tag certverify-backend-ci ./Backend
      - name: Build frontend production image and validate Nginx
        run: docker build --tag certverify-frontend-ci ./Frontend
