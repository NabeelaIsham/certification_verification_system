name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend-lint, directory: Backend, command: 'npm run lint' }
          - { name: backend-test, directory: Backend, command: 'npm test' }
          - { name: backend-integration, directory: Backend, command: 'npm run test:integration' }
          - { name: backend-audit, directory: Backend, command: 'npm audit --audit-level=high' }
          - { name: backend-production-audit, directory: Backend, command: 'npm audit --omit=dev --audit-level=high' }
          - { name: frontend-lint, directory: Frontend, command: 'npm run lint' }
          - { name: frontend-test, directory: Frontend, command: 'npm test -- --run' }
          - { name: frontend-build, directory: Frontend, command: 'npm run build' }
          - { name: frontend-audit, directory: Frontend, command: 'npm audit --audit-level=high' }
          - { name: frontend-production-audit, directory: Frontend, command: 'npm audit --omit=dev --audit-level=high' }
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run check
        env:
          VITE_SAAS_ENABLED: 'true'
        run: ${{ matrix.command }}

  container-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate standalone Atlas deployment configuration
        env:
          DEPLOYMENT_NAME: certverify-staging-ci
          DEPLOYMENT_ENV: staging
          BACKEND_ENV_FILE: ./Backend/.env.example
        run: docker compose -f docker-compose.atlas.yml config --quiet
      - name: Build backend production image
        run: docker build --tag certverify-backend-ci ./Backend
      - name: Build frontend production image and validate Nginx
        run: docker build --build-arg VITE_SAAS_ENABLED=true --tag certverify-frontend-ci ./Frontend
