x-logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  storage-init:
    image: alpine:3.22
    user: '0:0'
    command:
      - sh
      - '-ec'
      - chown -Rh 1000:1000 /data/uploads /data/backups
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    restart: 'no'
  backend:
    build: ./Backend
    user: '1000:1000'
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      PORT: 5000
      API_URL: https://certiverxia.com
      FRONTEND_URL: https://certiverxia.com
      PUBLIC_DOMAIN_ALIASES: www.certiverxia.com
      CORS_ALLOWED_ORIGINS: https://certiverxia.com
      TRUST_PROXY: '2'
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in Dokploy Environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy Environment}
      CREDENTIAL_KEY_ENCRYPTION_SECRET: ${CREDENTIAL_KEY_ENCRYPTION_SECRET:?Set CREDENTIAL_KEY_ENCRYPTION_SECRET in Dokploy Environment}
      VERIFICATION_PRIVACY_SECRET: ${VERIFICATION_PRIVACY_SECRET:?Set VERIFICATION_PRIVACY_SECRET in Dokploy Environment}
      EMAIL_PASS: ${EMAIL_PASS:?Set EMAIL_PASS in Dokploy Environment}
      EMAIL_HOST: smtp.hostinger.com
      EMAIL_PORT: '465'
      EMAIL_USER: info@certiverxia.com
      EMAIL_FROM_NAME: Certiverxia
      TEXTLK_API_TOKEN: ${TEXTLK_API_TOKEN:?Set TEXTLK_API_TOKEN in Dokploy Environment}
      TEXTLK_SENDER_ID: ${TEXTLK_SENDER_ID:?Set your approved TEXTLK_SENDER_ID in Dokploy Environment}
      TEXTLK_SMS_ENDPOINT: ${TEXTLK_SMS_ENDPOINT:-https://app.text.lk/api/v3/sms/send}
      TEXTLK_AUTH_PREFIX: ${TEXTLK_AUTH_PREFIX:-Bearer}
      TEXTLK_TIMEOUT_MS: ${TEXTLK_TIMEOUT_MS:-10000}
      SAAS_ENABLED: 'true'
      OUTBOUND_DELIVERY_MODE: ${OUTBOUND_DELIVERY_MODE:-disabled}
      BACKUP_DIRECTORY: /usr/src/app/backups
    command:
      - sh
      - '-c'
      - node scripts/productionPreflight.js && exec node server.js
    volumes:
      - uploads:/usr/src/app/uploads
      - backups:/usr/src/app/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - require("http").get("http://127.0.0.1:5000/health",r=>process.exit(r.statusCode===200?0:1)).on("error",()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - default
  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_SAAS_ENABLED: 'true'
        NGINX_CONFIG: nginx.dokploy.conf
    # Dokploy manages the apex domain. These explicit routers also cover www,
    # including TLS before Nginx redirects it to the canonical apex domain.
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.services.certiverxia-www.loadbalancer.server.port: '80'
      traefik.http.routers.certiverxia-www-http.rule: 'Host(`www.certiverxia.com`)'
      traefik.http.routers.certiverxia-www-http.entrypoints: web
      traefik.http.routers.certiverxia-www-http.service: certiverxia-www
      traefik.http.routers.certiverxia-www-http.middlewares: certiverxia-www-https
      traefik.http.middlewares.certiverxia-www-https.redirectscheme.scheme: https
      traefik.http.middlewares.certiverxia-www-https.redirectscheme.permanent: 'true'
      traefik.http.routers.certiverxia-www-https.rule: 'Host(`www.certiverxia.com`)'
      traefik.http.routers.certiverxia-www-https.entrypoints: websecure
      traefik.http.routers.certiverxia-www-https.service: certiverxia-www
      traefik.http.routers.certiverxia-www-https.tls: 'true'
      traefik.http.routers.certiverxia-www-https.tls.certresolver: letsencrypt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - default
      - dokploy-network
volumes:
  uploads: null
  backups: null
networks:
  default: {}
  dokploy-network:
    external: true
